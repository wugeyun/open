<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown编辑器 武哥出品</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f5f5f5;
        }
        
        .header {
            background-color: #fff;
            border-bottom: 1px solid #e0e0e0;
            padding: 10px 20px;
            display: flex;
            align-items: center;
        }
        
        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-right: 20px;
        }
        
        .toolbar {
            display: flex;
            gap: 10px;
        }
        
        .toolbar button {
            background-color: #f0f0f0;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .toolbar button:hover {
            background-color: #e0e0e0;
        }
        
        .editor-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .editor-pane, .preview-pane {
            padding: 20px;
            overflow: auto;
            display: flex;
            flex-direction: column;
        }
        
        .editor-pane {
            width: 40%;
            height: 100%;
        }
        
        .preview-pane {
            width: 60%;
            height: 100%;
        }
        
        .pane-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        #editor {
            flex: 1;
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: none;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 14px;
            line-height: 1.5;
            background-color: #fff;
        }
        
        #preview {
            flex: 1;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #fff;
            overflow: auto;
        }
        
        .resizer {
            width: 5px;
            background-color: #e0e0e0;
            cursor: col-resize;
            position: relative;
        }
        
        .resizer:hover {
            background-color: #ccc;
        }
        
        .status-bar {
            background-color: #fff;
            border-top: 1px solid #e0e0e0;
            padding: 5px 20px;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }
        
        /* 添加深色主题支持 */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1e1e1e;
                color: #d4d4d4;
            }
            
            .header, .status-bar {
                background-color: #2d2d30;
                border-color: #3c3c40;
            }
            
            .logo, .pane-header {
                color: #d4d4d4;
            }
            
            .toolbar button {
                background-color: #3c3c40;
                border-color: #555;
                color: #d4d4d4;
            }
            
            .toolbar button:hover {
                background-color: #4d4d50;
            }
            
            #editor, #preview {
                background-color: #1e1e1e;
                border-color: #3c3c40;
                color: #d4d4d4;
            }
            
            .resizer {
                background-color: #3c3c40;
            }
            
            .resizer:hover {
                background-color: #555;
            }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .editor-container {
                flex-direction: column;
            }
            
            .editor-pane {
                height: 20%;
                width: 100%;
            }
            
            .preview-pane {
                height: 80%;
                width: 100%;
            }
            
            .resizer {
                width: 100%;
                height: 5px;
                cursor: row-resize;
            }
        }
        
        /* 预览样式改进 */
        #preview pre {
            background-color: #f8f8f8;
            border-radius: 4px;
            padding: 12px;
            overflow: auto;
            position: relative;
        }
        
        #preview blockquote {
            background-color: #f8f8f8;
            border-left: 4px solid #ddd;
            padding: 10px 20px;
            margin: 0;
        }
        
        #preview code {
            background-color: #f8f8f8;
            padding: 2px 4px;
            border-radius: 3px;
        }
        
        #preview table {
            border-collapse: collapse;
            width: 100%;
        }
        
        #preview table, #preview th, #preview td {
            border: 1px solid #ddd;
        }
        
        #preview th, #preview td {
            padding: 8px;
            text-align: left;
        }
        
        #preview th {
            background-color: #f2f2f2;
        }
        
        .copy-button {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 3px;
            padding: 3px 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .copy-button:hover {
            background-color: #e0e0e0;
        }
        
        .copy-button.copied {
            background-color: #4CAF50;
            color: white;
        }
        
        @media (prefers-color-scheme: dark) {
            #preview pre, #preview blockquote, #preview code {
                background-color: #2d2d30;
            }
            
            #preview blockquote {
                border-left-color: #555;
            }
            
            #preview th {
                background-color: #3c3c40;
            }
            
            #preview table, #preview th, #preview td {
                border-color: #555;
            }
            
            .copy-button {
                background-color: #3c3c40;
                border-color: #555;
                color: #d4d4d4;
            }
            
            .copy-button:hover {
                background-color: #4d4d50;
            }
            
            .copy-button.copied {
                background-color: #4CAF50;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Markdown 编辑器</div>
        <div class="toolbar">
            <button id="new-btn">新建</button>
            <button id="open-btn">打开</button>
            <button id="save-btn">保存</button>
        </div>
    </div>
    
    <div class="editor-container">
        <div class="editor-pane">
            <div class="pane-header">编辑器</div>
            <textarea id="editor" placeholder="在此输入Markdown内容..."></textarea>
        </div>
        <div class="resizer" id="resizer"></div>
        <div class="preview-pane">
            <div class="pane-header">预览</div>
            <div id="preview"></div>
        </div>
    </div>
    
    <div class="status-bar">
        <div id="file-info">未命名.md</div>
        <div id="status">就绪</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // 初始化变量
        let currentFileHandle = null;
        let isDirty = false;
        
        // 获取DOM元素
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const newBtn = document.getElementById('new-btn');
        const openBtn = document.getElementById('open-btn');
        const saveBtn = document.getElementById('save-btn');
        const fileInfo = document.getElementById('file-info');
        const status = document.getElementById('status');
        const resizer = document.getElementById('resizer');
        const editorPane = document.querySelector('.editor-pane');
        const previewPane = document.querySelector('.preview-pane');
        
        // 配置Marked
        marked.setOptions({
            gfm: true,
            breaks: true,
            smartLists: true,
            smartypants: true,
            highlight: function(code, lang) {
                return code;
            }
        });
        
        // 初始化编辑器内容
        editor.value = "# 欢迎使用 Markdown Editor\n\n这是一个实时预览的Markdown编辑器，支持以下功能：\n\n- 实时编辑预览\n- 文件打开、保存和新建\n- 跨平台支持（Mac和Windows）\n\n## 常见Markdown语法示例\n\n### 文本样式\n\n**粗体文本** *斜体文本* ~~删除线文本~~ `行内代码`\n\n### 标题\n\n# 一级标题\n## 二级标题\n\n### 列表\n\n无序列表：\n- 项目1\n- 项目2\n  - 子项目2.1\n  - 子项目2.2\n\n有序列表：\n1. 第一项\n2. 第二项\n3. 第三项\n\n### 链接和图片\n\n[链接文本](https://example.com)\n\n![图片alt文本](hero.png)\n\n### 引用\n\n> 这是一个引用块\n\n### 代码块\n\n\`\`\`python\n# Python代码示例\ndef fibonacci(n):\n    if n <= 1:\n        return n\n    else:\n        return fibonacci(n-1) + fibonacci(n-2)\n\nprint(fibonacci(10))\n\`\`\`\n\n### 表格\n\n| 姓名 | 年龄 | 城市 |\n| ---- | ---- | ---- |\n| 张三 | 25   | 北京 |\n| 李四 | 30   | 上海 |\n| 王五 | 28   | 广州 |\n\n### 分割线\n\n---\n\n### 任务列表\n\n- [x] 已完成任务\n- [ ] 未完成任务\n- [ ] 另一个未完成任务";
        renderMarkdown();
        
        // 实时预览功能
        editor.addEventListener('input', () => {
            isDirty = true;
            updateFileInfo();
            renderMarkdown();
        });
        
        // 渲染Markdown
        function renderMarkdown() {
            // 使用Marked库渲染Markdown
            preview.innerHTML = marked.parse(editor.value);
            
            // 为代码块添加复制按钮
            addCopyButtons();
            
            updateStatus('预览已更新');
        }
        
        // 为代码块添加复制按钮
        function addCopyButtons() {
            const codeBlocks = document.querySelectorAll('pre');
            codeBlocks.forEach(block => {
                // 检查是否已添加复制按钮
                if (block.querySelector('.copy-button')) return;
                
                const button = document.createElement('button');
                button.className = 'copy-button';
                button.textContent = '复制';
                
                button.addEventListener('click', () => {
                    const code = block.querySelector('code');
                    const text = code ? code.innerText : block.innerText;
                    
                    navigator.clipboard.writeText(text).then(() => {
                        // 更新按钮状态
                        button.textContent = '已复制';
                        button.classList.add('copied');
                        
                        // 2秒后恢复原状态
                        setTimeout(() => {
                            button.textContent = '复制';
                            button.classList.remove('copied');
                        }, 2000);
                    }).catch(err => {
                        console.error('复制失败:', err);
                        button.textContent = '复制失败';
                        
                        // 2秒后恢复原状态
                        setTimeout(() => {
                            button.textContent = '复制';
                        }, 2000);
                    });
                });
                
                block.style.position = 'relative';
                block.appendChild(button);
            });
        }
        
        // 更新状态栏
        function updateStatus(message) {
            status.textContent = message;
            setTimeout(() => {
                status.textContent = '就绪';
            }, 2000);
        }
        
        // 更新文件信息
        function updateFileInfo() {
            const fileName = currentFileHandle ? currentFileHandle.name : '未命名.md';
            fileInfo.textContent = isDirty ? `${fileName} *` : fileName;
        }
        
        // 新建文件
        newBtn.addEventListener('click', () => {
            if (isDirty) {
                const confirmed = confirm('您有未保存的更改，确定要新建文件吗？');
                if (!confirmed) return;
            }
            
            editor.value = '';
            currentFileHandle = null;
            isDirty = false;
            updateFileInfo();
            renderMarkdown();
            updateStatus('已新建文件');
        });
        
        // 打开文件
        openBtn.addEventListener('click', async () => {
            if (isDirty) {
                const confirmed = confirm('您有未保存的更改，确定要打开其他文件吗？');
                if (!confirmed) return;
            }
            
            try {
                // 检查是否支持File System Access API
                if (!window.showOpenFilePicker) {
                    // 创建文件输入元素用于传统文件选择
                    const fileInput = document.createElement('input');
                    fileInput.type = 'file';
                    fileInput.accept = '.md, .txt, text/markdown, text/plain';
                    fileInput.onchange = async (event) => {
                        const file = event.target.files[0];
                        if (file) {
                            const contents = await file.text();
                            editor.value = contents;
                            currentFileHandle = null; // 传统方式打开的文件没有句柄
                            isDirty = false;
                            updateFileInfo();
                            renderMarkdown();
                            updateStatus(`已打开文件: ${file.name}`);
                        }
                    };
                    fileInput.click();
                    return;
                }
                
                const [fileHandle] = await window.showOpenFilePicker({
                    types: [{
                        description: 'Markdown文件',
                        accept: {
                            'text/markdown': ['.md'],
                            'text/plain': ['.txt']
                        }
                    }]
                });
                
                const file = await fileHandle.getFile();
                const contents = await file.text();
                
                editor.value = contents;
                currentFileHandle = fileHandle;
                isDirty = false;
                updateFileInfo();
                renderMarkdown();
                updateStatus(`已打开文件: ${fileHandle.name}`);
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error(err);
                    alert('打开文件时出错: ' + err.message);
                }
            }
        });
        
        // 保存文件
        saveBtn.addEventListener('click', async () => {
            try {
                // 如果没有当前文件句柄，先显示保存对话框
                if (!currentFileHandle) {
                    // 检查是否支持File System Access API
                    if (!window.showSaveFilePicker) {
                        // 降级到传统下载方式
                        const blob = new Blob([editor.value], { type: 'text/markdown;charset=utf-8' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = getCurrentFileName();
                        a.click();
                        URL.revokeObjectURL(url);
                        isDirty = false;
                        updateFileInfo();
                        updateStatus('文件已下载');
                        return;
                    }
                    
                    currentFileHandle = await window.showSaveFilePicker({
                        suggestedName: getCurrentFileName(),
                        types: [{
                            description: 'Markdown文件',
                            accept: {
                                'text/markdown': ['.md'],
                                'text/plain': ['.txt']
                            }
                        }]
                    });
                }
                
                // 写入文件
                const writable = await currentFileHandle.createWritable();
                await writable.write(editor.value);
                await writable.close();
                
                isDirty = false;
                updateFileInfo();
                updateStatus(`文件已保存: ${currentFileHandle.name}`);
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error(err);
                    alert('保存文件时出错: ' + err.message);
                }
            }
        });
        
        // 获取当前文件名
        function getCurrentFileName() {
            if (currentFileHandle) {
                return currentFileHandle.name;
            }
            return '未命名.md';
        }
        
        // 页面加载完成提示
        window.addEventListener('DOMContentLoaded', () => {
            updateStatus('应用已加载');
        });
        
        // 添加键盘快捷键支持
        document.addEventListener('keydown', (e) => {
            // Ctrl+S 或 Cmd+S 保存
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveBtn.click();
            }
            
            // Ctrl+O 或 Cmd+O 打开
            if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
                e.preventDefault();
                openBtn.click();
            }
            
            // Ctrl+N 或 Cmd+N 新建
            if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                e.preventDefault();
                newBtn.click();
            }
        });
        
        // 在页面关闭前检查未保存的更改
        window.addEventListener('beforeunload', (e) => {
            if (isDirty) {
                e.preventDefault();
                e.returnValue = '';
                return '';
            }
        });
        
        // 实现拖拽调整大小功能
        let isResizing = false;
        
        // 鼠标事件
        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            // 根据当前布局设置光标样式
            const isMobile = window.matchMedia('(max-width: 768px)').matches;
            document.body.style.cursor = isMobile ? 'row-resize' : 'col-resize';
            e.preventDefault();
        });
        
        // 触摸事件
        resizer.addEventListener('touchstart', (e) => {
            isResizing = true;
            const isMobile = window.matchMedia('(max-width: 768px)').matches;
            document.body.style.cursor = isMobile ? 'row-resize' : 'col-resize';
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            handleResize(e.clientY, e.clientX);
        });
        
        document.addEventListener('touchmove', (e) => {
            if (!isResizing) return;
            const touch = e.touches[0];
            handleResize(touch.clientY, touch.clientX);
            e.preventDefault();
        }, { passive: false });
        
        document.addEventListener('mouseup', () => {
            isResizing = false;
            document.body.style.cursor = '';
        });
        
        document.addEventListener('touchend', () => {
            isResizing = false;
            document.body.style.cursor = '';
        });
        
        // 处理调整大小的逻辑
        function handleResize(clientY, clientX) {
            const container = document.querySelector('.editor-container');
            const containerRect = container.getBoundingClientRect();
            
            // 检查当前是水平布局还是垂直布局
            const isMobile = window.matchMedia('(max-width: 768px)').matches;
            
            if (isMobile) {
                // 移动端垂直布局调整高度
                const percentage = ((clientY - containerRect.top) / containerRect.height) * 100;
                
                // 限制最小高度
                if (percentage > 10 && percentage < 90) {
                    editorPane.style.height = `${percentage}%`;
                    previewPane.style.height = `${100 - percentage}%`;
                }
            } else {
                // 桌面端水平布局调整宽度
                const percentage = ((clientX - containerRect.left) / containerRect.width) * 100;
                
                // 限制最小宽度
                if (percentage > 10 && percentage < 90) {
                    editorPane.style.width = `${percentage}%`;
                    previewPane.style.width = `${100 - percentage}%`;
                }
            }
        }
    </script>
</body>
</html>
