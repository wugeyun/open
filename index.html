<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>武哥云相册</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Animate.css 动画库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2ecc71;
            --gradient: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }
        
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .album-container {
            padding: 40px 0;
        }
        
        .page-title {
            font-weight: 700;
            margin-bottom: 40px;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            font-size: 3rem;
            position: relative;
        }
        
        .page-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: var(--gradient);
            border-radius: 2px;
        }
        
        .photo-card {
            margin-bottom: 25px;
            border: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .photo-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }
        
        .card-img-container {
            overflow: hidden;
            background-color: #f5f5f5; /* 轻微背景色替代占位图 */
        }
        
        .card-img-top {
            width: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            display: block; /* 修改为 block，确保图片默认显示 */
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        /* 横版图片样式 */
        .landscape {
            height: 250px;
        }
        
        /* 竖版图片样式 */
        .portrait {
            height: 350px;
        }
        
        .photo-card:hover .card-img-top {
            transform: scale(1.05);
        }
        
        .card-body {
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            min-height: 60px;
        }
        
        .card-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 0;
            text-align: center;
            width: 100%;
            padding: 10px 0;
        }
        
        /* 模态框样式 */
        .modal-full {
            max-width: 95%;
        }
        
        .modal-content {
            border: none;
            background: transparent;
        }
        
        .modal-body {
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
        }
        
        .modal-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        
        .btn-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            opacity: 1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1050;
        }
        
        /* 粒子背景效果 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <!-- 粒子背景 -->
    <canvas id="particles" class="particles"></canvas>
    
    <div class="container album-container">
        <h1 class="page-title animate__animated animate__fadeInDown">武哥作品画廊</h1>
        
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <!-- 照片卡片1 - 横版 -->
            <div class="col animate__animated animate__fadeIn">
                <div class="card photo-card h-100" data-bs-toggle="modal" data-bs-target="#photoModal" data-img="https://img-s.msn.cn/tenant/amp/entityid/BB1msG12">
                    <div class="card-img-container">
                        <img data-src="https://img-s.msn.cn/tenant/amp/entityid/BB1msG12" class="card-img-top lazy landscape" alt="未来城市">
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">未来城市</h5>
                    </div>
                </div>
            </div>
            
            <!-- 照片卡片2 - 竖版 -->
            <div class="col animate__animated animate__fadeIn animate__delay-1s">
                <div class="card photo-card h-100" data-bs-toggle="modal" data-bs-target="#photoModal" data-img="https://img.500px.me/500px1112635513.jpg!p5">
                    <div class="card-img-container">
                        <img data-src="https://img.500px.me/500px1112635513.jpg!p5" class="card-img-top lazy portrait" alt="自然风光">
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">自然风光</h5>
                    </div>
                </div>
            </div>
            
            <!-- 照片卡片3 - 横版 -->
            <div class="col animate__animated animate__fadeIn animate__delay-2s">
                <div class="card photo-card h-100" data-bs-toggle="modal" data-bs-target="#photoModal" data-img="https://img-s.msn.cn/tenant/amp/entityid/BB1msG12">
                    <div class="card-img-container">
                        <img data-src="https://img-s.msn.cn/tenant/amp/entityid/BB1msG12" class="card-img-top lazy landscape" alt="数字宇宙">
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">数字宇宙</h5>
                    </div>
                </div>
            </div>
            
            <!-- 照片卡片4 - 竖版 -->
            <div class="col animate__animated animate__fadeIn">
                <div class="card photo-card h-100" data-bs-toggle="modal" data-bs-target="#photoModal" data-img="https://img.500px.me/500px1112635513.jpg!p5">
                    <div class="card-img-container">
                        <img data-src="https://img.500px.me/500px1112635513.jpg!p5" class="card-img-top lazy portrait" alt="山水之间">
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">山水之间</h5>
                    </div>
                </div>
            </div>
            
            <!-- 照片卡片5 - 横版 -->
            <div class="col animate__animated animate__fadeIn animate__delay-1s">
                <div class="card photo-card h-100" data-bs-toggle="modal" data-bs-target="#photoModal" data-img="https://img-s.msn.cn/tenant/amp/entityid/BB1msG12">
                    <div class="card-img-container">
                        <img data-src="https://img-s.msn.cn/tenant/amp/entityid/BB1msG12" class="card-img-top lazy landscape" alt="光影交错">
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">光影交错</h5>
                    </div>
                </div>
            </div>
            
            <!-- 照片卡片6 - 竖版 -->
            <div class="col animate__animated animate__fadeIn animate__delay-2s">
                <div class="card photo-card h-100" data-bs-toggle="modal" data-bs-target="#photoModal" data-img="https://img.500px.me/500px1112635513.jpg!p5">
                    <div class="card-img-container">
                        <img data-src="https://img.500px.me/500px1112635513.jpg!p5" class="card-img-top lazy portrait" alt="静谧时光">
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">静谧时光</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 图片放大模态框 -->
    <div class="modal fade" id="photoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-full">
            <div class="modal-content">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <div class="modal-body">
                    <img id="modalImage" class="modal-img" src="" alt="放大照片">
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS 和依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 粒子效果库 -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    
    <script>
        // 初始化粒子效果
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof particlesJS !== 'undefined') {
                particlesJS('particles', {
                    particles: {
                        number: { value: 80, density: { enable: true, value_area: 800 } },
                        color: { value: "#3498db" },
                        shape: { type: "circle" },
                        opacity: { value: 0.5, random: true },
                        size: { value: 3, random: true },
                        line_linked: { enable: true, distance: 150, color: "#3498db", opacity: 0.4, width: 1 },
                        move: { enable: true, speed: 2, direction: "none", random: true, straight: false, out_mode: "out" }
                    },
                    interactivity: {
                        detect_on: "canvas",
                        events: {
                            onhover: { enable: true, mode: "grab" },
                            onclick: { enable: true, mode: "push" }
                        }
                    }
                });
            }
            
            // 懒加载实现
            const lazyLoad = (target) => {
                const io = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const img = entry.target;
                            img.src = img.dataset.src;
                            
                            img.onload = function() {
                                this.classList.add('loaded');
                            };
                            
                            observer.unobserve(img);
                        }
                    });
                });
                
                io.observe(target);
            };
            
            // 为所有懒加载图片设置观察器
            const lazyImages = document.querySelectorAll('.lazy');
            lazyImages.forEach(lazyLoad);
            
            // 点击图片放大功能
            const photoModal = document.getElementById('photoModal');
            if (photoModal) {
                photoModal.addEventListener('show.bs.modal', function(event) {
                    const button = event.relatedTarget;
                    const imgSrc = button.getAttribute('data-img');
                    const modalImage = document.getElementById('modalImage');
                    modalImage.src = imgSrc;
                    
                    // 添加加载完成后的动画
                    modalImage.onload = function() {
                        this.classList.add('animate__animated', 'animate__zoomIn');
                        setTimeout(() => {
                            this.classList.remove('animate__animated', 'animate__zoomIn');
                        }, 500);
                    };
                });
            }
        });
    </script>
</body>
</html>
